server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/phishing}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
management.endpoints.web.exposure.include=health,info
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:5000}
ml.service.token=${ML_SERVICE_TOKEN:}
ml.service.timeout-ms=${ML_TIMEOUT_MS:30000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
